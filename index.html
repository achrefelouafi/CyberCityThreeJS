<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>NEO//KYOTO — infinite procedural city</title>
	<meta name="description" content="An infinite neon city generated by Blender Geometry Nodes, rebuilt live in Three.js WebGPU." />
</head>
<body>
	<canvas id="view"></canvas>

	<div id="hud" class="hud">
		<div class="hud-tl">
			<div class="brand"><span class="kanji">新京都</span><span class="title">NEO//KYOTO</span></div>
			<div class="sub">SECTOR <span id="hud-sector">00.00</span> · <span id="hud-mode">CINEMATIC</span></div>
		</div>
		<div class="hud-tr">
			<div class="badge">BLENDER GEOMETRY NODES <span class="arrow">→</span> THREE.JS WEBGPU</div>
			<div class="stats" id="hud-stats"></div>
			<button id="settings-btn" class="settings-btn" type="button" title="Post-processing, quality and city generator (G)">⚙ SETTINGS <b>G</b></button>
		</div>
		<div class="hud-bottom">
			<div class="hud-bl">
				<div class="gauge"><span class="label">SPD</span><span id="hud-speed" class="value">000</span><span class="unit">KM/H</span></div>
				<div class="gauge"><span class="label">ALT</span><span id="hud-alt" class="value">000</span><span class="unit">M</span></div>
			</div>
			<div class="hud-bc">
				<div id="shot" class="shot"></div>
				<div id="hint" class="hint">C OR W A S D — TAKE THE WHEEL</div>
				<div id="hud-credits" class="credits"></div>
			</div>
			<div class="hud-br">
				<div class="keys">
					<span><b>WASD</b> fly</span><span><b>SPACE/Q</b> up/down</span><span><b>SHIFT</b> boost</span><span><b>V</b> view</span><span><b>C</b> fly ⇄ cinematic</span><span><b>O</b> orbit</span><span><b>T</b> title</span><span><b>L</b> letterbox</span><span><b>G</b> settings</span><span><b>H</b> hide UI</span><span><b>R</b> record</span><span><b>P</b> photo</span>
				</div>
			</div>
		</div>
		<div id="rec" class="rec hidden">● REC <span id="rec-time">00:00</span></div>
	</div>

	<div id="loader" class="loader">
		<div class="loader-inner">
			<div class="loader-kanji">新京都</div>
			<div class="loader-title">NEO//KYOTO</div>
			<div class="loader-bar"><div id="loader-fill"></div></div>
			<div id="loader-msg" class="loader-msg">BOOTING</div>
		</div>
	</div>

	<script type="module" src="/src/main.js"></script>
</body>
</html>
